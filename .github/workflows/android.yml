name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_DYNAMIC_ENV_ID: ${{ vars.VITE_DYNAMIC_ENV_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install and build web app
        run: |
          npm install
          npm run build
      - name: Create Android project and sync
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android
      - name: Use a fixed debug signing key (so new APKs install over old ones)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SolaceFi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SolaceFi-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: SolaceFi latest build (debug APK)
          body: Debug APK for testing only. Built from commit ${{ github.sha }}.
          files: SolaceFi-debug.apk
          prerelease: true
